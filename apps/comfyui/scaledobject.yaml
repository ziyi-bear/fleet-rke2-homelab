apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: comfyui-scaler
  namespace: comfyui
  labels:
    app: comfyui
spec:
  scaleTargetRef:
    name: comfyui
  minReplicaCount: 0
  maxReplicaCount: 1
  cooldownPeriod: 900  # 15 minutes of inactivity before scaling to 0
  pollingInterval: 10
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://rancher-monitoring-prometheus.cattle-monitoring-system.svc:9090
        metricName: comfyui_ingress_requests
        threshold: "0"
        query: sum(increase(nginx_ingress_controller_requests{ingress="comfyui",namespace="kube-system"}[2m])) or vector(0)
